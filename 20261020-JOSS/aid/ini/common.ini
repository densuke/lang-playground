; TOPS-10 6.03 on pdp10-ka (構成は timereshared/dec-tops-10-simh-quickstart の common.ini に由来、BSD-3-Clause)
set env PORT 10603
set cpu 256k idle
at dpa0 /disks/ka_dskb0.rp3
at dpa1 /disks/ka_dskb1.rp3
at dpa2 /disks/ka_dskb2.rp3
at dpa3 /disks/ka_dskb3.rp3
at lpt  -n /disks/printer.txt
set cr disable
set mta type=b
set dc modem=8
at dc %PORT%
at mta0 -r /disks/bb-x130a-sb.tap
